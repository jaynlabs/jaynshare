name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            target/debug
          key: cargo-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-probe
          restore-keys: cargo-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Defender state
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          (Get-MpPreference).ExclusionPath
          $env:TEMP
      - run: cargo test --locked --bins --no-run
      - name: The test alone, 30 times
        run: |
          for i in $(seq 1 30); do
            echo "== alone $i"
            cargo test --locked --bins -q -- --nocapture --exact server::tests::concurrent_state_writes_all_succeed_and_the_last_one_is_current 2>&1 | grep -E 'slow phase|took|panicked|deadlocked|test result' || true
          done
      - name: The full unit suite, 10 times
        run: |
          for i in $(seq 1 10); do
            echo "== suite $i"
            cargo test --locked --bins -q -- --nocapture 2>&1 | grep -E 'slow phase|concurrent writes took|writer [0-9] round|panicked|deadlocked|test result' || true
          done
