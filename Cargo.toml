[package]
name = "jaynshare"
version = "2.2.2"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "The pooled Anthropic proxy for Claude Code"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "native-tokio", "http1", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy"] }
libc = "0.2"
getrandom = "0.4"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "net", "io-util", "macros", "process", "signal", "time", "sync"] }
toml = "1"
toml_edit = "0.25"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
unicase = "2"
x509-parser = { version = "0.16", features = ["verify"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The enrollment bundle and client kit are ZIP archives; stored plus deflate
# covers what the release tooling produces.
zip = { version = "4", default-features = false, features = ["deflate"] }
# The Linux platform archive is a `.tar.gz`; native install reads it.
flate2 = "1"
tar = { version = "0.4", default-features = false }
# Codex sends `/responses` zstd-compressed; decoded only to read its model.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# minisign-compatible Ed25519 verification of the release manifest.
ring = "0.17"
socket2 = "0.6.5"
if-addrs = "0.15.0"
# The keyboard picker's raw mode and keys, read from the controlling terminal
# (use-dev-tty) so a piped standard input does not blind it.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
# Private files' ACLs, set and read back by SID through the security API.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
